name: Accessibility Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/portfolio_2026/ > /dev/null; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Preview server never became ready"
          exit 1

      - name: Run accessibility scan
        run: npm run a11y:check
